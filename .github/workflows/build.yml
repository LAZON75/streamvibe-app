name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Android project
        run: |
          set -e
          A=android/app/src/main
          mkdir -p $A/java/com/streamvibe/app $A/assets $A/res/drawable

          cp index.html $A/assets/index.html
          curl -L --fail https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js -o $A/assets/hls.min.js
          sed -i 's#https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js#hls.min.js#' $A/assets/index.html

          cat > android/settings.gradle <<'EOF'
          pluginManagement {
            repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
            repositories { google(); mavenCentral() }
          }
          rootProject.name = 'StreamVibe'
          include ':app'
          EOF

          cat > android/build.gradle <<'EOF'
          plugins {
            id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.nonTransitiveRClass=true
          EOF

          cat > android/app/build.gradle <<'EOF'
          plugins {
            id 'com.android.application'
          }
          android {
            namespace 'com.streamvibe.app'
            compileSdk 34
            defaultConfig {
              applicationId 'com.streamvibe.app'
              minSdk 21
              targetSdk 34
              versionCode 1
              versionName '1.0'
            }
          }
          EOF

          cat > $A/res/drawable/banner.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
            <item>
              <shape android:shape="rectangle">
                <gradient android:startColor="#0b1b3d" android:endColor="#d81b60" android:angle="45"/>
              </shape>
            </item>
          </layer-list>
          EOF

          cat > $A/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
            <uses-feature android:name="android.hardware.touchscreen" android:required="false"/>
            <uses-feature android:name="android.software.leanback" android:required="false"/>
            <application
              android:label="StreamVibe"
              android:icon="@drawable/banner"
              android:banner="@drawable/banner"
              android:usesCleartextTraffic="true"
              android:hardwareAccelerated="true"
              android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
              <activity
                android:name=".MainActivity"
                android:exported="true"
                android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout|uiMode">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                  <category android:name="android.intent.category.LEANBACK_LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat > $A/java/com/streamvibe/app/MainActivity.java <<'EOF'
          package com.streamvibe.app;

          import android.app.Activity;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;

          public class MainActivity extends Activity {
            private WebView web;
            private FrameLayout root;
            private View customView;
            private WebChromeClient.CustomViewCallback customCb;

            private void immersive() {
              getWindow().getDecorView().setSystemUiVisibility(
                View.SYSTEM_UI_FLAG_FULLSCREEN
                | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION);
            }

            @Override
            protected void onCreate(Bundle b) {
              super.onCreate(b);
              getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
              root = new FrameLayout(this);
              root.setBackgroundColor(Color.BLACK);
              web = new WebView(this);
              root.addView(web, new FrameLayout.LayoutParams(-1, -1));
              setContentView(root);
              immersive();

              WebSettings s = web.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setAllowFileAccess(true);
              s.setAllowFileAccessFromFileURLs(true);
              s.setAllowUniversalAccessFromFileURLs(true);
              s.setMediaPlaybackRequiresUserGesture(false);
              s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);

              web.setWebViewClient(new WebViewClient());
              web.setWebChromeClient(new WebChromeClient() {
                @Override
                public void onShowCustomView(View v, CustomViewCallback cb) {
                  if (customView != null) { cb.onCustomViewHidden(); return; }
                  customView = v;
                  customCb = cb;
                  root.addView(v, new FrameLayout.LayoutParams(-1, -1));
                  web.setVisibility(View.GONE);
                  immersive();
                }
                @Override
                public void onHideCustomView() {
                  if (customView == null) return;
                  root.removeView(customView);
                  customView = null;
                  web.setVisibility(View.VISIBLE);
                  if (customCb != null) customCb.onCustomViewHidden();
                }
              });
              web.loadUrl("file:///android_asset/index.html");
            }

            @Override
            public void onWindowFocusChanged(boolean f) {
              super.onWindowFocusChanged(f);
              if (f) immersive();
            }

            @Override
            public void onBackPressed() {
              if (customView != null) {
                web.getWebChromeClient().onHideCustomView();
                return;
              }
              web.evaluateJavascript(
                "(function(){var l=document.getElementById('live');if(l&&l.style.display==='grid'){closeLive();return 1}return 0})()",
                v -> { if (!"1".equals(v)) finish(); });
            }

            @Override
            protected void onPause() { super.onPause(); web.onPause(); }

            @Override
            protected void onResume() { super.onResume(); web.onResume(); }
          }
          EOF

      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Prepare APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk StreamVibe.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: StreamVibe v${{ github.run_number }}
          files: StreamVibe.apk
